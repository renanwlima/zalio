openapi: 3.0.0
info:
  title: Zalio - Gestão Financeira Pessoal
  description: "API completa para o sistema Zalio (Supabase Backend). Permite controle total (CRUD) sobre transações, despesas fixas, cofrinhos, orçamentos por categoria e histórico."
  version: 1.4.0
servers:
  - url: https://lhaqrqpegqqubnkeyrhk.supabase.co/rest/v1
    description: "Servidor de Produção (Supabase - Zalio)"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: "Chave anônima do Supabase (anon key) indispensável nas requisições."
  schemas:
    Transaction:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        value: { type: number }
        date: { type: string, format: date }
        type: { type: string, enum: [entrada, saída] }
        category: { type: string }
    FixedExpense:
      type: object
      properties:
        id: { type: integer }
        description: { type: string }
        value: { type: number }
        due_date: { type: integer }
    Cofrinho:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        target_value: { type: number }
        current_balance: { type: number }
    Budget:
      type: object
      properties:
        id: { type: integer }
        category: { type: string }
        limit_value: { type: number }

security:
  - bearerAuth: []
    apiKey: []

paths:
  /transactions:
    get:
      summary: Consultar histórico de transações com filtros temporais.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string }
          description: "Filtros de data padrão PostgREST (ex: gte.2026-03-01&lte.2026-03-31 para navegação mensal)."
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: "Filtrar por tipo (ex: eq.saída)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      summary: Adicionar transação (incluindo lançamentos retroativos).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '201':
          description: Criado
    patch:
      summary: Editar transação existente.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador da transação usando sintaxe eq (ex: eq.12)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '200':
          description: "Editado com sucesso."
    delete:
      summary: Apagar transação do histórico.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador da transação usando sintaxe eq (ex: eq.12)."
      responses:
        '204':
          description: "Removido com sucesso."

  /fixed_expenses:
    get:
      summary: Consultar despesas fixas.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedExpense'
    post:
      summary: Adicionar despesa fixa.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedExpense'
      responses:
        '201':
          description: Criado
    patch:
      summary: Editar despesa fixa.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador da despesa (ex: eq.5)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedExpense'
      responses:
        '200':
          description: Editado
    delete:
      summary: Apagar despesa fixa.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador da despesa (ex: eq.5)."
      responses:
        '204':
          description: Removido

  /cofrinhos:
    get:
      summary: Consultar cofrinhos e metas de economia.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cofrinho'
    post:
      summary: Criar cofrinho.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cofrinho'
      responses:
        '201':
          description: Criado
    patch:
      summary: Editar progresso ou valor do cofrinho.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador do cofrinho (ex: eq.1)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cofrinho'
      responses:
        '200':
          description: Editado
    delete:
      summary: Apagar cofrinho.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador do cofrinho (ex: eq.1)."
      responses:
        '204':
          description: Removido

  /budgets:
    get:
      summary: Consultar limites de orçamento por categoria.
      responses:
        '200':
          description: "Lista de limites definidos retornada com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
    post:
      summary: Definir teto/limite de gastos para uma categoria.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '201':
          description: "Limite criado."
    patch:
      summary: Atualizar teto de uma categoria.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador do orçamento (ex: eq.3)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '200':
          description: "Limite atualizado."
    delete:
      summary: Remover teto de gastos de uma categoria.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: "Identificador do orçamento (ex: eq.3)."
      responses:
        '204':
          description: "Limite excluído."